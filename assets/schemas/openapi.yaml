openapi: 3.1.0
info:
  title: MAPNA PARS Dynamic Production Planning API
  version: 1.0.0
  description: Contract baseline for dynamic planning, scenario analysis, decisions and actual event ingestion.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Planning
  - name: Production Orders
  - name: Resources
  - name: Scenarios
  - name: Decisions
  - name: Actuals
  - name: Lessons
paths:
  /plans/current:
    get:
      tags: [Planning]
      operationId: getCurrentPlan
      responses:
        '200':
          description: Current active baseline plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
  /plans/recalculate:
    post:
      tags: [Planning]
      operationId: recalculatePlan
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecalculateRequest'
      responses:
        '202': {description: Recalculation job accepted}
        '409': {$ref: '#/components/responses/Conflict'}
  /planning-days/{date}/close:
    post:
      tags: [Planning]
      operationId: closePlanningDay
      parameters:
        - name: date
          in: path
          required: true
          schema: {type: string, format: date}
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Day closed}
  /production-orders:
    post:
      tags: [Production Orders]
      operationId: createPlanningProductionOrder
      parameters: [{'$ref':'#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CreateProductionOrderRequest'}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/ProductionOrder'}}}}
  /production-orders/{id}/priority:
    patch:
      tags: [Production Orders]
      operationId: changeProductionOrderPriority
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PriorityChangeRequest'}
      responses:
        '202': {description: Priority event accepted}
        '409': {$ref: '#/components/responses/Conflict'}
  /resources/{id}/breakdowns:
    post:
      tags: [Resources]
      operationId: registerBreakdown
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/BreakdownRequest'}}
      responses:
        '202': {description: Breakdown event accepted}
  /materials/{id}/forecast:
    get:
      tags: [Planning]
      operationId: getMaterialForecast
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Time-phased material forecast
          content: {application/json: {schema: {$ref: '#/components/schemas/MaterialForecast'}}}
  /scenarios:
    post:
      tags: [Scenarios]
      operationId: createScenario
      parameters: [{'$ref':'#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateScenarioRequest'}}}
      responses:
        '201': {description: Scenario created, content: {application/json: {schema: {$ref: '#/components/schemas/Scenario'}}}}
  /scenarios/{id}/events:
    post:
      tags: [Scenarios]
      operationId: addScenarioEvent
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioEvent'}}}
      responses:
        '202': {description: Event accepted}
        '409': {$ref: '#/components/responses/Conflict'}
  /scenarios/{id}/calculate:
    post:
      tags: [Scenarios]
      operationId: calculateScenario
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {description: Scenario calculation started}
  /scenarios/{id}/impacts:
    get:
      tags: [Scenarios]
      operationId: getScenarioImpacts
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Scenario impact result, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioResult'}}}}
  /scenarios/{id}/optimize:
    post:
      tags: [Scenarios]
      operationId: optimizeScenario
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OptimizationRequest'}}}
      responses:
        '202': {description: Optimization started}
  /scenarios/{id}/commit:
    post:
      tags: [Scenarios]
      operationId: commitScenario
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CommitScenarioRequest'}}}
      responses:
        '201': {description: New plan version created}
        '409': {$ref: '#/components/responses/Conflict'}
  /decisions:
    post:
      tags: [Decisions]
      operationId: createDecision
      parameters: [{'$ref':'#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DecisionRequest'}}}
      responses:
        '201': {description: Decision record created}
  /actual-events:
    post:
      tags: [Actuals]
      operationId: ingestActualEvent
      parameters: [{'$ref':'#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ActualEvent'}}}
      responses:
        '202': {description: Actual event accepted}
  /lessons/similar:
    get:
      tags: [Lessons]
      operationId: findSimilarLessons
      parameters:
        - {name: rootCauseCode, in: query, required: false, schema: {type: string}}
        - {name: resourceType, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Similar lessons}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8}}
    IfMatch: {name: If-Match, in: header, required: false, schema: {type: string}}
  responses:
    Conflict:
      description: Optimistic concurrency or stale plan conflict
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail, correlationId]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        correlationId: {type: string}
    Plan:
      type: object
      required: [planVersionId, planningDay, status]
      properties:
        planVersionId: {type: string, format: uuid}
        planningDay: {type: string, format: date}
        status: {type: string}
        modelVersion: {type: string}
        rulesVersion: {type: string}
    RecalculateRequest:
      type: object
      required: [basePlanVersionId, horizonTo]
      properties:
        basePlanVersionId: {type: string, format: uuid}
        horizonTo: {type: string, format: date}
        reasonCode: {type: string}
    CreateProductionOrderRequest:
      type: object
      required: [productId, plannedStart, plannedFinish, priority]
      properties:
        productId: {type: string, format: uuid}
        externalSapOrderNo: {type: string}
        plannedStart: {type: string, format: date}
        plannedFinish: {type: string, format: date}
        priority: {type: integer, minimum: 1}
    PriorityChangeRequest:
      type: object
      required: [effectiveDay, newPriority, reasonCode]
      properties:
        effectiveDay: {type: string, format: date}
        newPriority: {type: integer, minimum: 1}
        reasonCode: {type: string}
    BreakdownRequest:
      type: object
      required: [effectiveDay, durationDays, reasonCode, confidence]
      properties:
        effectiveDay: {type: string, format: date}
        durationDays: {type: integer, minimum: 1}
        reasonCode: {type: string}
        confidence: {type: string, enum: [HIGH, MEDIUM, LOW]}
        source: {type: string}
    CreateScenarioRequest:
      type: object
      required: [basePlanVersionId, name, horizon]
      properties:
        basePlanVersionId: {type: string, format: uuid}
        name: {type: string}
        horizon:
          type: object
          required: [from, to]
          properties:
            from: {type: string, format: date}
            to: {type: string, format: date}
        initialEvents: {type: array, items: {$ref: '#/components/schemas/ScenarioEvent'}}
    ScenarioEvent:
      type: object
      required: [type, effectiveDay, targetType, targetId, payload]
      properties:
        type: {type: string}
        effectiveDay: {type: string, format: date}
        targetType: {type: string}
        targetId: {type: string}
        payload: {type: object, additionalProperties: true}
    OptimizationRequest:
      type: object
      required: [objective, constraints]
      properties:
        objective: {type: string}
        constraints: {type: object, additionalProperties: true}
    CommitScenarioRequest:
      type: object
      required: [alternativeId, decisionId]
      properties:
        alternativeId: {type: string, format: uuid}
        decisionId: {type: string, format: uuid}
    DecisionRequest:
      type: object
      required: [scenarioId, selectedAlternativeId, rationale]
      properties:
        scenarioId: {type: string, format: uuid}
        selectedAlternativeId: {type: string, format: uuid}
        rationale: {type: string}
    ActualEvent:
      type: object
      required: [eventType, planningDay, entityType, entityId, eventTime, sourceSystem, sourceId]
      properties:
        eventType: {type: string}
        planningDay: {type: string, format: date}
        entityType: {type: string}
        entityId: {type: string, format: uuid}
        eventTime: {type: string, format: date-time}
        quantity: {type: number}
        hours: {type: number}
        amount: {type: number}
        sourceSystem: {type: string}
        sourceId: {type: string}
        payload: {type: object, additionalProperties: true}
    MaterialForecast:
      type: object
      required: [materialId, rows]
      properties:
        materialId: {type: string, format: uuid}
        rows:
          type: array
          items:
            type: object
            properties:
              day: {type: string, format: date}
              opening: {type: number}
              receipts: {type: number}
              demand: {type: number}
              closing: {type: number}
              status: {type: string}
    Scenario:
      type: object
      required: [scenarioId, basePlanVersionId, status]
      properties:
        scenarioId: {type: string, format: uuid}
        basePlanVersionId: {type: string, format: uuid}
        status: {type: string}
    ScenarioResult:
      type: object
      properties:
        scenarioId: {type: string, format: uuid}
        feasibility: {type: string}
        commitmentImpacts: {type: array, items: {type: object}}
        resourceRequirements: {type: array, items: {type: object}}
        materialShortages: {type: array, items: {type: object}}
        opportunityCost: {type: array, items: {type: object}}
